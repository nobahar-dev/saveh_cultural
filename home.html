<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="resources/css/bootstrap.rtl.css">
    <link rel="stylesheet" href="resources/css/style.css">
    <title>سازمان فرهنگی اجتماعی ورزشی شهرستان ساوه</title>
</head>
<body>
   <!-- start of header -->
   <header class="header position-relative">
    <div class="site-logo d-flex align-items-center justify-content-center pt-3 pb-5">
        <a href="#">
            <img class="img-fluid" src="resources/images/site_logo.png" alt="">
        </a>
    </div>
    <div class="container">
        <nav class="navbar navbar-expand-lg shadow-sm">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-expanded="false">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="#" class="nav-link active" aria-current="page">خانه</a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link">اخبار</a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link" aria-current="page">درباره ما</a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link" aria-current="page">تماس با ما</a>
                        </li>
                    </ul>
                    <form action="#" class="d-flex" role="search">
                        <div class="input-g position-relative">
                            <input type="search" class="search-input shadow-sm" placeholder="جستجو...">
                            <i class="bi bi-search position-absolute"></i>
                        </div>
                    </form>
                </div>
            </div>
        </nav>
    </div>
   </header>
   <!-- end of header -->

   <!-- slider -->
   <section class="slider">
    <div class="swiper slider-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide position-relative">
                <div class="slider-title position-absolute">متن آزمایشی عنوان تصویر</div>
                <img class="img-fluid" src="resources/images/slider-1.png" alt="">
            </div>
            <div class="swiper-slide">
                <img class="img-fluid" src="resources/images/slider-2.png" alt="">
            </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>
   </section>
   <!-- slider -->

<script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
<script src="resources/js/bootstrap.bundle.js"></script>    
<script src="resources/js/app.js"></script> 
</body>
</html>
